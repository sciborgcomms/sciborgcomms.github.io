<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" type="image/png" sizes="16x16" href="./sciborg-favicon.png">

    <!-- AUTO-REDIRECT SCRIPT -->
    <script>

<body class="flex items-center justify-center h-screen flex-col text-center p-4">

    <h1 class="text-2xl font-bold mb-4">Taking you to our Quick-Review...</h1>
    <p class="mb-4">If you are not redirected automatically, please <a href="https://docs.google.com/forms/d/e/1FAIpQLSciPtQ9S3dzzrBl1T-Tndx3IiXI3wVct6tcSaxJTeWBmfWrAA/viewform" class="underline accent-color font-bold">click here</a>.</p>
